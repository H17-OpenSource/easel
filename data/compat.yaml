# Which resource trained for one model family works on a checkpoint of another: public facts about the model
# architectures, no instance data. One rule per (source_family, target_family, artifact_type). The source
# family is the family a resource was trained on (lora.trained_on_family), else the family it is filed under;
# the target family is the checkpoint's. A pair without a rule is `untested` with confidence 0.
# `easel registry compatible <sha16>` joins these rules with the registry; an instance adds or replaces rules
# in <home>/data/compat.yaml (its rule wins for the same key).
schema: easel/compat/1
basis: public model-architecture facts (same family = native; cross-family rules from the architectures)
# 154 rules, sorted by source family, target family, type
