start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">c</text><text x="1040.0" y="280.0" font-size="22" fill="#1e2a2f" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">1</text><text x="1064.0" y="280.0" font-size="19" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">diamond clearance, × s</text><text x="780.0" y="314.0" font-size="22" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">α</text><text x="1040.0" y="314.0" font-size="22" fill="#61707a" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">21.80°</text><text x="1064.0" y="314.0" font-size="19" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">leg slant = atan(F / H)</text><text x="780.0" y="348.0" font-size="22" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">lh</text><text x="1040.0" y="348.0" font-size="22" fill="#61707a" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">216</text><text x="1064.0" y="348.0" font-size="19" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">legs = H − fh − s − 2g</text><text x="780.0" y="382.0" font-size="22" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">D</text><text x="1040.0" y="382.0" font-size="22" fill="#61707a" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">176.0</text><text x="1064.0" y="382.0" font-size="19" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">diamond = (F − s) − c·s</text><text x="780.0" y="416.0" font-size="22" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">cy</text><text x="1040.0" y="416.0" font-size="22" fill="#61707a" text-anchor="end" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">374</text><text x="1064.0" y="416.0" font-size="19" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">diamond centre = (s + fh + g) / 2</text><text x="780.0" y="500.0" font-size="26" fill="#1e2a2f" text-anchor="start" font-weight="600" font-family="Segoe UI, Arial, sans-serif">Rules</text><text x="780.0" y="540.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">· one stroke s everywhere; the legs are s wide, measured</text><text x="798.0" y="570.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">square to their edges</text><text x="780.0" y="606.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">· one gap g: frame to ledge and ledge to legs</text><text x="780.0" y="642.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">· the legs' outer edges meet at the top centre (an</text><text x="798.0" y="672.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">A-frame), so each foot lands under the frame's outer</text><text x="798.0" y="702.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">edge</text><text x="780.0" y="738.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">· the ledge is as wide as the mark is tall: the mark is</text><text x="798.0" y="768.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">square</text><text x="780.0" y="804.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">· the diamond sits c·s from the frame sides, centred</text><text x="798.0" y="834.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">between the top bar and the ledge</text><text x="780.0" y="870.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">· straight edges and square corners only; mirror-</text><text x="798.0" y="900.0" font-size="20" fill="#61707a" text-anchor="start" font-weight="normal" font-family="Segoe UI, Arial, sans-serif">symmetric about the axis</text></svg>
