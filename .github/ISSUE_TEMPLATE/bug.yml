name: "Bug"
description: "A command did something other than its help or its runbook says."
title: "[bug] <verb>: <one line>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "One problem per issue. Reproduce it on the demo (`examples/demo/`) or on synthetic values if you can. Leave out private values: no absolute paths (write `<home>`, `<models_root>`), no names or account names, no tokens, no ids of your own records, and no description of any image. Vulnerabilities do not belong here: see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: "easel version"
      description: "the line `easel --version` prints"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: "operating system and Python"
      description: "for example: Windows 11, Python 3.12"
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: "command"
      description: "the exact command, as typed"
      render: text
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: "output (last 20 lines)"
      description: "stdout and stderr, private values removed"
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "expected"
      description: "what the help or the runbook says, with the runbook file and line"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "steps to reproduce"
      description: "from a fresh demo instance, one step per line"
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "Before you submit"
      options:
        - label: "I removed private values: no absolute paths, names, account names, tokens or ids of my own records, and no images."
          required: true
