name: "Runbook gap"
description: "A runbook is missing, unclear, or wrong about a literal line or a command."
title: "[runbook-gap] <NN-stage>: <one line>"
labels: ["runbook-gap"]
body:
  - type: markdown
    attributes:
      value: "Name the runbook and the section; quote the line that is wrong and say what really happened. Leave out private values: no absolute paths (write `<home>`, `<models_root>`), no names or account names, no tokens, no ids of your own records, and no description of any image. Vulnerabilities do not belong here: see SECURITY.md."
  - type: input
    id: runbook
    attributes:
      label: "runbook file and section"
      description: "for example: docs/runbooks/NN-stage.md, section 4"
    validations:
      required: true
  - type: textarea
    id: documented
    attributes:
      label: "what the runbook says"
      description: "the line or command, quoted"
      render: text
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: "what happened instead"
      description: "the command you ran and the lines it printed"
      render: text
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: "proposed change"
      description: "the new text, or the failure-table row to add"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "acceptance criteria"
      description: "Written before the work starts: each one a command and the literal line it prints, or a test that passes. The pull request is judged against exactly these."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: "Before you submit"
      options:
        - label: "I removed private values: no absolute paths, names, account names, tokens or ids of my own records, and no images."
          required: true
