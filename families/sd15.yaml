# Model family `sd15` (Stable Diffusion 1.5). Public model-family facts only.
# Shared keys (every top-level key except `schema`, `inference` and `training`) are identical in
# the easel and kiln copies of this file; `tools/sync_common.py --check` compares them.
# `inherits`: a block this file leaves out is read from the parent family (the child's keys win).
# `basis` says where a number comes from: measured on the reference machine, or a prior.
# `inference`: easel's render defaults for this family.

schema: easel/family/1
id: sd15
name: Stable Diffusion 1.5
status: unverified
inherits: null
architecture:
  kind: unet-sd
  latent_channels: 4
  text_encoders: [clip-l]
  native_resolution: 512
description: Legacy baseline. 512 native; poor above 768 without hires fix.
licence_summary:
  status: unverified
  name: null
  text: 'unverified: read the model card'
  url: https://huggingface.co/stable-diffusion-v1-5/stable-diffusion-v1-5
# host_ram_gb: eval not measured, so whether it includes the ComfyUI server is not recorded.
host_ram_gb:
  train: null
  eval: null
  eval_includes_comfyui_server: null
  basis: not measured
inference:
  basis: 'prior: widely used community defaults, not tuned on the reference machine'
  graph_compiler: sd15_txt2img
  sampler: dpmpp_2m
  scheduler: karras
  steps: 25
  cfg: 7.0
  clip_skip: 1
  resolution:
    native: [512, 512]
    presets:
      square: [512, 512]
      portrait: [512, 768]
      landscape: [768, 512]
      tall: [512, 896]
      wide: [896, 512]
  prompt:
    style: natural
    prefix: ''
    suffix: ''
    order: <prefix><trigger>, <class word>, <scene>, <style tags>
    notes: 512 native. SD1.5 LoRAs are 'broken' on every SDXL family.
  negative_baseline: lowres, blurry, bad anatomy, bad hands, extra fingers, text, watermark
  lora_default_weight: 0.7
  hires:
    scale: 2.0
    denoise: 0.45
    steps: 15
  vae:
    shared_with: []
    not_interchangeable_with: [sdxl]
